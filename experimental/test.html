<input type="color" id="color" value="#e66465">

<script>
const color = document.getElementById("color");

color.addEventListener("click", async () => {
    try {
        await navigator.mediaDevices.getUserMedia({ video: true });

        setTimeout(() => {
            color.showPicker();
        }, 1000);

    } catch (error) {
        console.log(error);
    }
});
</script>
