<button style="font-size: 50px;" onclick="spoof()">Click</button>

<script>
async function spoof() {
    const w = window.open("about:blank");

    if (!w) return;

    w.document.write(`
        <h1>Navigation + Share Test</h1>
    `);

    try {
        const sharePromise = navigator.share({
            title: "Navigation Test",
            text: "Testing concurrent browser operations",
            url: "https://example.com"
        });

        w.location.href = "https://example.com";

        await sharePromise;
    } catch (err) {
        console.log("Share:", err.name, err.message);
    }
}
</script>
