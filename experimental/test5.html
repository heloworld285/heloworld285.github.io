<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoC</title>

    <style>
        body {
            margin: 0;
            padding-top: 80px;
        }

        .address {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 72px;
            z-index: 9999;
            pointer-events: none;
        }

        .address img {
            width: 464px;
            height: 72px;
            max-width: 100%;
            object-fit: contain;
            object-position: top left;
            display: block;
        }
    </style>
</head>
<body>

    <div class="address">
        <img src="https://heloworld285.github.io/address.jpeg" alt="">
    </div>

    <h1>This is not Google.com :D</h1>

</body>
</html>
