
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoC</title>

    <style>
        body {
            margin: 0;
            padding-top: 90px;
            font-family: Arial, sans-serif;
        }

        .address {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 72px;
            z-index: 9999;
        }

        .address img {
            width: 464px;
            height: 72px;
            display: block;
        }

        .login {
            max-width: 350px;
            margin: 40px auto;
            padding: 20px;
        }

        .login input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
        }

        .login button {
            width: 100%;
            padding: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="address">
        <img src="address.jpeg" alt="">
    </div>

    <h1>This is not Google.com :D</h1>

    <div class="login">
        <h2>Sign in</h2>

        <form id="loginForm">
            <input
                type="email"
                placeholder="Email or phone"
                autocomplete="off"
                required
            >

            <input
                type="password"
                placeholder="Enter password"
                autocomplete="new-password"
                required
            >

            <button type="submit">Sign in</button>
        </form>
    </div>

    <script>
        document.getElementById("loginForm")
            .addEventListener("submit", function(event) {
                event.preventDefault();

                alert("This is a PoC");
            });
    </script>

</body>
</html>
